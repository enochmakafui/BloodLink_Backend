services:
  - type: web
    name: bloodlink-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && flask --app run db upgrade
    startCommand: gunicorn run:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: bloodlink-db
          property: connectionString

databases:
  - name: bloodlink-db
    plan: free
