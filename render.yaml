services:
  - type: web
    name: bloodlink-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: GOOGLE_CLIENT_ID
        value: 391369153857-ct65sdhbq4fk4neeaiaqp4mggej3b373.apps.googleusercontent.com
      - key: DATABASE_URL
        sync: false # set in the Render dashboard (Supabase Session pooler URL)

databases:
  - name: bloodlink-db
    plan: free
